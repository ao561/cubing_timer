<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cubing Timer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d0f13'/%3E%3Cg fill='%235eead4'%3E%3Crect x='6' y='6' width='6' height='6' rx='1'/%3E%3Crect x='13' y='6' width='6' height='6' rx='1'/%3E%3Crect x='20' y='6' width='6' height='6' rx='1'/%3E%3Crect x='6' y='13' width='6' height='6' rx='1'/%3E%3Crect x='13' y='13' width='6' height='6' rx='1'/%3E%3Crect x='20' y='13' width='6' height='6' rx='1'/%3E%3Crect x='6' y='20' width='6' height='6' rx='1'/%3E%3Crect x='13' y='20' width='6' height='6' rx='1'/%3E%3Crect x='20' y='20' width='6' height='6' rx='1'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="timer-pane">
    <header class="scramble-bar">
      <p id="scramble" class="scramble">Loading scramble…</p>
      <button id="new-scramble" class="ghost-btn" type="button" title="Generate a new scramble">↻ New scramble</button>
    </header>

    <section id="timer-zone" class="timer-zone" tabindex="-1">
      <div id="time" class="time">0.000</div>
      <p id="hint" class="hint">Hold <kbd>Space</kbd> to prime · release to start</p>
    </section>
  </main>

  <aside class="sidebar">
    <section class="stats">
      <div class="stat">
        <span class="stat-label">best</span>
        <span class="stat-value" id="stat-best">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">ao5</span>
        <span class="stat-value" id="stat-ao5">—</span>
        <span class="stat-sub">best <span id="stat-ao5-best">—</span></span>
      </div>
      <div class="stat">
        <span class="stat-label">ao12</span>
        <span class="stat-value" id="stat-ao12">—</span>
        <span class="stat-sub">best <span id="stat-ao12-best">—</span></span>
      </div>
      <div class="stat">
        <span class="stat-label">solves</span>
        <span class="stat-value" id="stat-count">0</span>
        <span class="stat-sub">mean <span id="stat-mean">—</span></span>
      </div>
    </section>

    <h2 class="sidebar-title">Recent solves</h2>
    <ul id="solve-list" class="solve-list"></ul>
    <p id="empty-state" class="empty-state">No solves yet. Go race the clock.</p>
  </aside>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
