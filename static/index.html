<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cubing Timer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d0f13'/%3E%3Cg fill='%235eead4'%3E%3Crect x='6' y='6' width='6' height='6' rx='1'/%3E%3Crect x='13' y='6' width='6' height='6' rx='1'/%3E%3Crect x='20' y='6' width='6' height='6' rx='1'/%3E%3Crect x='6' y='13' width='6' height='6' rx='1'/%3E%3Crect x='13' y='13' width='6' height='6' rx='1'/%3E%3Crect x='20' y='13' width='6' height='6' rx='1'/%3E%3Crect x='6' y='20' width='6' height='6' rx='1'/%3E%3Crect x='13' y='20' width='6' height='6' rx='1'/%3E%3Crect x='20' y='20' width='6' height='6' rx='1'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/style.css" />
  <script>
    // Applied before first paint so the page never flashes the wrong theme.
    try {
      const saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.dataset.theme = saved;
      }
    } catch (_) { /* storage unavailable */ }
  </script>
</head>
<body>
  <main class="timer-pane">
    <header class="scramble-bar">
      <select id="event-select" class="event-select" title="WCA event" aria-label="WCA event">
        <option value="222">2x2x2</option>
        <option value="333" selected>3x3x3</option>
        <option value="333oh">3x3x3 One-Handed</option>
        <option value="333bf">3x3x3 Blindfolded</option>
        <option value="444">4x4x4</option>
        <option value="555">5x5x5</option>
        <option value="666">6x6x6</option>
        <option value="777">7x7x7</option>
        <option value="pyram">Pyraminx</option>
        <option value="skewb">Skewb</option>
      </select>
      <p id="scramble" class="scramble">Loading scramble…</p>
      <button id="new-scramble" class="ghost-btn" type="button" title="Generate a new scramble">↻ New scramble</button>
      <button id="theme-toggle" class="ghost-btn icon-btn" type="button" title="Switch theme" aria-label="Switch theme">
        <span aria-hidden="true" id="theme-icon">☾</span>
      </button>
    </header>

    <section id="timer-zone" class="timer-zone" tabindex="-1">
      <div id="time" class="time">0.000</div>
      <p id="hint" class="hint">Hold <kbd>Space</kbd> to prime · release to start</p>
    </section>

    <figure id="cube-panel" class="cube-panel">
      <div class="cube-viewport">
        <twisty-player
          id="cube-player"
          puzzle="3x3x3"
          visualization="PG3D"
          background="none"
          hint-facelets="none"
          back-view="none"
        ></twisty-player>
        <p id="cube-fallback" class="cube-fallback" hidden>3D preview unavailable — check your connection.</p>
      </div>
      <figcaption class="cube-caption">
        <span>scramble preview · drag to rotate</span>
        <button id="cube-view" class="chip" type="button" title="Toggle 3D / 2D view">2D</button>
      </figcaption>
    </figure>
  </main>

  <aside class="sidebar">
    <section class="stats">
      <div class="stat">
        <span class="stat-label">best</span>
        <span class="stat-value" id="stat-best">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">ao5</span>
        <span class="stat-value" id="stat-ao5">—</span>
        <span class="stat-sub">best <span id="stat-ao5-best">—</span></span>
      </div>
      <div class="stat">
        <span class="stat-label">ao12</span>
        <span class="stat-value" id="stat-ao12">—</span>
        <span class="stat-sub">best <span id="stat-ao12-best">—</span></span>
      </div>
      <div class="stat">
        <span class="stat-label">solves</span>
        <span class="stat-value" id="stat-count">0</span>
        <span class="stat-sub">mean <span id="stat-mean">—</span></span>
      </div>
    </section>

    <h2 class="sidebar-title">Recent solves</h2>
    <ul id="solve-list" class="solve-list"></ul>
    <p id="empty-state" class="empty-state">No solves yet. Go race the clock.</p>
  </aside>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
